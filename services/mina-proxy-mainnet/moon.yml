layer: application
language: typescript
stack: infrastructure
id: mina-proxy-mainnet
dependsOn:
  - proxy-handler
tasks:
  dev:
    command: wrangler dev
    preset: server
  deploy:
    command: wrangler deploy
    deps:
      - ^:build
  deploy-preview:
    command: wrangler versions upload
    deps:
      - ^:build
  type-cf:
    command: wrangler types
    inputs:
      - wrangler.jsonc
    outputs:
      - worker-configuration.d.ts
  publish-cf-build-config:
    description: Publish the checked-in Cloudflare Workers Build config for this project.
    script: pnpm exec moon run cloudflare-build-config:sync -- services/mina-proxy-mainnet/workers-build.jsonc
    options:
      cache: false

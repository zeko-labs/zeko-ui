id: bridge-validator
layer: application
language: typescript
stack: backend
fileGroups:
  sources:
    - src/**/*
    - moon.yml
    - package.json
    - README.md
    - AGENTS.md
    - CLAUDE.md
    - .env.example
    - Dockerfile
    - scripts/**/*
    - wrangler.jsonc
    - worker-configuration.d.ts
    - tsconfig.json
    - tsdown.config.ts
  tests:
    - tests/**/*
    - vitest.config.ts
tasks:
  dev:
    command: wrangler dev --config wrangler.jsonc
    preset: server
  build:
    command: tsdown
    inputs:
      - "@group(sources)"
    outputs:
      - dist/**
  typecheck:
    command: tsc --noEmit
    inputs:
      - "@group(sources)"
      - "@group(tests)"
  lint:
    command: biome lint --diagnostic-level=error
    inputs:
      - "@group(sources)"
      - "@group(tests)"
  test:
    command: vitest run
    inputs:
      - "@group(sources)"
      - "@group(tests)"
  type-cf:
    command: wrangler types --config wrangler.jsonc
    options:
      cache: false
    inputs:
      - wrangler.jsonc
    outputs:
      - worker-configuration.d.ts
  deploy:
    command: wrangler deploy --config wrangler.jsonc
    deps:
      - type-cf
  sync-secrets:
    command: bash scripts/push-secrets-from-env.sh
    options:
      cache: false
  trigger-deposit:
    command: wrangler workflows trigger bridge-validator '{"routeKey":"mina-to-zeko"}' --config wrangler.jsonc
    options:
      cache: false
  trigger-withdrawal:
    command: wrangler workflows trigger bridge-validator '{"routeKey":"zeko-to-mina"}' --config wrangler.jsonc
    options:
      cache: false
  list-instances:
    command: wrangler workflows instances list bridge-validator --config wrangler.jsonc
    options:
      cache: false
  describe-instance:
    command: >
      bash -lc 'wrangler workflows instances describe bridge-validator "$VALIDATOR_INSTANCE_ID" --config wrangler.jsonc'
    options:
      cache: false
  status:
    command: >
      bash -lc 'curl -fsS -H "authorization: Bearer $VALIDATOR_API_TOKEN" "${BRIDGE_VALIDATOR_BASE_URL:-https://bridge-validator.zeko-labs.workers.dev}/bridge-status?instanceId=$VALIDATOR_INSTANCE_ID"'
    options:
      cache: false
  status-logs:
    command: >
      bash -lc 'curl -fsS -H "authorization: Bearer $VALIDATOR_API_TOKEN" "${BRIDGE_VALIDATOR_BASE_URL:-https://bridge-validator.zeko-labs.workers.dev}/bridge-status?instanceId=$VALIDATOR_INSTANCE_ID&logs=1"'
    options:
      cache: false

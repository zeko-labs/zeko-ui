id: bridge-validator
layer: application
language: typescript
stack: backend
fileGroups:
  sources:
    - src/**/*
    - moon.yml
    - package.json
    - README.md
    - AGENTS.md
    - CLAUDE.md
    - .env.example
    - env.d.ts
    - Dockerfile
    - scripts/**/*
    - wrangler.jsonc
    - worker-configuration.d.ts
    - tsconfig.json
    - tsdown.config.ts
  tests:
    - tests/**/*
    - vitest.config.ts
tasks:
  dev:
    command: wrangler dev --config wrangler.jsonc
    preset: server
  build:
    command: tsdown
    inputs:
      - "@group(sources)"
    outputs:
      - dist/**
  typecheck:
    command: tsc --noEmit
    inputs:
      - "@group(sources)"
      - "@group(tests)"
  lint:
    command: biome lint --diagnostic-level=error
    inputs:
      - "@group(sources)"
      - "@group(tests)"
  test:
    command: vitest run
    inputs:
      - "@group(sources)"
      - "@group(tests)"
  type-cf:
    command: wrangler types --config wrangler.jsonc
    options:
      cache: false
    inputs:
      - wrangler.jsonc
    outputs:
      - worker-configuration.d.ts
  deploy:
    command: wrangler deploy --config wrangler.jsonc
    deps:
      - type-cf

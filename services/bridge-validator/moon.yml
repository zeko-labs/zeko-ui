id: bridge-validator
layer: application
language: typescript
stack: backend
dependsOn:
  - networks
fileGroups:
  sources:
    - src/**/*
    - moon.yml
    - package.json
    - README.md
    - AGENTS.md
    - CLAUDE.md
    - .env.example
    - Dockerfile
    - scripts/**/*
    - wrangler.jsonc
    - worker-configuration.d.ts
    - tsconfig.json
    - tsdown.config.ts
  tests:
    - tests/**/*
    - vitest.config.ts
tasks:
  dev:
    command: wrangler dev --config wrangler.jsonc
    preset: server
  build:
    command: tsdown
    deps:
      - ^:build
    inputs:
      - "@group(sources)"
    outputs:
      - dist/**
  typecheck:
    deps:
      - ^:build
    command: tsgo --noEmit --declaration false --declarationMap false
    inputs:
      - "@group(sources)"
      - "@group(tests)"
  lint:
    command: biome lint --diagnostic-level=error
    inputs:
      - "@group(sources)"
      - "@group(tests)"
  test:
    command: vitest run
    inputs:
      - "@group(sources)"
      - "@group(tests)"
  type-cf:
    command: wrangler types --config wrangler.jsonc
    options:
      cache: false
    inputs:
      - wrangler.jsonc
    outputs:
      - worker-configuration.d.ts
  publish-cf-build-config:
    description: Publish the checked-in Cloudflare Workers Build config for this project.
    command: zeko-cloudflare-build-config
    args:
      - services/bridge-validator/workers-build.jsonc
    options:
      cache: false
  deploy:
    command: wrangler deploy --config wrangler.jsonc
    deps:
      - type-cf
  sync-secrets:
    command: nu scripts/sync-secrets.nu
    options:
      cache: false
  trigger-deposit:
    command: wrangler workflows trigger bridge-validator '{"routeKey":"mina-to-zeko"}' --config wrangler.jsonc
    options:
      cache: false
  trigger-withdrawal:
    command: wrangler workflows trigger bridge-validator '{"routeKey":"zeko-to-mina"}' --config wrangler.jsonc
    options:
      cache: false
  start-deposit:
    command: nu scripts/start.nu mina-to-zeko
    options:
      cache: false
  start-withdrawal:
    command: nu scripts/start.nu zeko-to-mina
    options:
      cache: false
  list-instances:
    command: wrangler workflows instances list bridge-validator --config wrangler.jsonc
    options:
      cache: false
  describe-instance:
    command: nu scripts/describe-instance.nu
    options:
      cache: false
  status:
    command: nu scripts/status.nu
    options:
      cache: false
  status-logs:
    command: nu scripts/status.nu --logs
    options:
      cache: false
  cleanup:
    command: nu scripts/cleanup.nu
    options:
      cache: false

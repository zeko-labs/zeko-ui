# yaml-language-server: $schema=../../../.moon/cache/schemas/project.json

id: lb-indexer
layer: application
stack: backend

tasks:
  dev:
    command: bun --watch src/index.ts
    preset: server
  start:
    command: bun src/index.ts
    preset: server
  test-integration:
    command: vitest run
    inputs:
      - "src/**/*"
      - "test/**/*"

id: actions-api
layer: library
stack: backend
fileGroups:
  sources:
    - src/**/*
    - scripts/**/*
    - drizzle.config.ts
    - package.json
    - tsconfig.json
    - tsdown.config.ts
  tests:
    - tests/**/*
    - vitest.config.ts
dependsOn:
  - graphql
tasks:
  dev:
    command: wrangler dev
    preset: server
  build:
    command: tsdown
    deps:
      - ^:build
    options:
      cache: false
    inputs:
      - "@group(sources)"
    outputs:
      - dist/**
  start-standalone:
    description: Run the API as a standalone Node.js server (DATABASE_URL required; PORT defaults to 9100).
    deps:
      - build
    command: node dist/standalone.js
    preset: server
    options:
      envFile: true
  unit:
    command: vitest
    args:
      - run
      - --config
      - vitest.unit.config.ts
    options:
      cache: false
  manual-db-test:
    description: Manual local Postgres integration test. Starts Docker, prepares schema, runs test, and tears down.
    script: |
      set -eu
      db_url="postgresql://postgres:postgres@localhost:5434/actions"
      if ! docker info >/dev/null 2>&1; then
        echo "Docker daemon is not running. Start Docker/OrbStack and rerun moon run actions-api:manual-db-test."
        exit 1
      fi
      docker compose down -v --remove-orphans || true
      docker compose up -d --wait
      cleanup() {
        docker compose down -v --remove-orphans || true
      }
      trap cleanup EXIT
      DATABASE_URL="$db_url" pnpm exec drizzle-kit push
      ACTIONS_API_TEST_DATABASE_URL="$db_url" vitest run --config vitest.node.config.ts
    options:
      cache: false
  manual-e2e-live:
    description: Manual live smoke test against deployed actions-api endpoint (set ACTIONS_API_E2E_BASE_URL to override).
    script: vitest run tests/actions.live-e2e.test.ts
    options:
      cache: false
  live-e2e-testnet:
    description: Live smoke test against the deployed testnet actions-api endpoint.
    command: vitest
    args:
      - run
      - tests/actions.live-e2e.test.ts
    env:
      ACTIONS_API_E2E_BASE_URL: https://testnet.api.actions.zeko.io
    options:
      cache: false
      runInCI: false
  live-e2e-mainnet:
    description: Live smoke test against the deployed mainnet actions-api endpoint.
    command: vitest
    args:
      - run
      - tests/actions.live-e2e.test.ts
    env:
      ACTIONS_API_E2E_BASE_URL: https://api.actions.zeko.io
    options:
      cache: false
      runInCI: false
  live-e2e-sepolia:
    description: Live smoke test against the deployed Sepolia actions-api endpoint.
    command: vitest
    args:
      - run
      - tests/actions.live-e2e.test.ts
    env:
      ACTIONS_API_E2E_BASE_URL: https://sepolia.api.actions.zeko.io
    options:
      cache: false
      runInCI: false
  schema:
    command: bun run graphql/printSchema.ts
    inputs:
      - "@group(sources)"
    outputs:
      - graphql/schema.graphql
  type-cf:
    command: wrangler types
    options:
      cache: false
    inputs:
      - wrangler.jsonc
    outputs:
      - worker-configuration.d.ts
  publish-cf-build-config:
    description: Publish the checked-in Cloudflare Workers Build config for this project.
    script: pnpm exec moon run cloudflare-build-config:sync -- services/actions/api/workers-build.jsonc
    options:
      cache: false
  db-generate:
    description: Generate migrations files after a schema change.
    command: drizzle-kit generate
    options:
      cache: false
  db-migrate:
    description: Run migrations. This leverages the DATABASE_URL env variable.
    command: bun run scripts/migrate.ts
    options:
      cache: false
  db-studio:
    command: drizzle-kit studio
    preset: server
  db-seed:
    description: Seed the database with initial data.
    command: noop
    options:
      cache: false
  services-start:
    command: docker compose up -d
    options:
      cache: false
  services-stop:
    command: docker compose down
    options:
      cache: false
  services-reset:
    script: docker compose down -v && docker compose up -d --wait && pnpm exec moon actions-api:db-migrate && pnpm exec moon actions-api:db-seed
    options:
      cache: false
  lint:
    command: biome check --formatter-enabled=false
    inputs:
      - "@group(sources)"
      - "@group(tests)"
  typecheck:
    deps:
      - ^:build
    command: tsgo --noEmit --declaration false --declarationMap false -p tsconfig.json
    inputs:
      - "@group(sources)"
      - "@group(tests)"
  lint-fix:
    command: biome check --formatter-enabled=false --write
    inputs:
      - "@group(sources)"
      - "@group(tests)"
  deploy:
    command: wrangler deploy
    deps:
      - ^:build
    options:
      runInCI: false
  deploy-testnet:
    command: wrangler deploy --env testnet
    deps:
      - ^:build
    options:
      runInCI: false
  deploy-mainnet:
    command: wrangler deploy
    deps:
      - ^:build
    options:
      runInCI: false
  deploy-sepolia:
    command: wrangler deploy --env sepolia
    deps:
      - ^:build
    options:
      runInCI: false
  deploy-preview:
    command: wrangler versions upload --env testnet
    deps:
      - ^:build
    options:
      runInCI: false

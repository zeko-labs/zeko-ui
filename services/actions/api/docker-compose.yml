services:
  postgres:
    image: supabase/postgres:17.6.1.020
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: leaderboard

      SUPABASE_AUTH_ADMIN_JWT_SECRET: "your-super-secret-jwt-token-with-at-least-32-characters"
      POSTGRES_HOST_AUTH_METHOD: "scram-sha-256"

    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d leaderboard"]
      interval: 1s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

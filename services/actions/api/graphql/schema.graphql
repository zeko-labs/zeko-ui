type Commit implements OuterAction {
  afterState: String
  beforeState: String
  blockHeight: Int
  fields: [String!]
  finalityStatus: String
  index: Int
  innerActionState: String
  innerActionStateLength: Int
  kind: OuterActionKind
  ledger: String
  markedAsCanonicalAt: String
  slotRangeLower: String
  slotRangeUpper: String
  synchronizedOuterActionState: String
  synchronizedOuterActionStateLength: Int
  timestamp: String
  txnHash: String
}

type CommitAsePastSlotResult {
  ase: [OuterActionUnion!]
  commit: Commit
}

type EthereumAssetEntry {
  path: [String!]
  record: EthereumAssetRecord
}

type EthereumAssetRecord {
  assetId: String
  blockHeight: Int
  decimals: Int
  ethereumTokenAddress: String
  finalityStatus: String
  inventoryCap: String
  mftStandardVkId: String
  registryIndex: Int
  schemaVersion: Int
  timestamp: String
  tokenIdL2: String
  tokenOwnerL2: String
  txnHash: String
  universalBridgeVkId: String
  vaultPublicKey: String
}

input EthereumAssetRegistryInput {
  assetId: String
  ethereumTokenAddress: String
  index: Int
  root: String
}

type EthereumAssetRegistrySnapshot {
  blockHeight: Int
  count: Int
  depth: Int
  finalityStatus: String
  records: [EthereumAssetEntry!]
  root: String
  schemaVersion: Int
  timestamp: String
  txnHash: String
}

type InnerAction {
  accountUpdateId: String
  afterState: String
  aux: String
  beforeState: String
  blockHeight: Int
  fields: [String!]
  finalityStatus: String
  index: Int
  markedAsCanonicalAt: String
  timestamp: String
  txnHash: String
}

input InnerActionsInput {
  afterState: String
  beforeState: String!
}

input InnerWitnessesFromAuxesInput {
  auxes: [String!]!
}

interface OuterAction {
  afterState: String
  beforeState: String
  blockHeight: Int
  fields: [String!]
  finalityStatus: String
  index: Int
  kind: OuterActionKind
  markedAsCanonicalAt: String
  slotRangeLower: String
  slotRangeUpper: String
  timestamp: String
  txnHash: String
}

enum OuterActionKind {
  COMMIT
  WITNESS
}

union OuterActionUnion = Commit | Witness

input OuterActionsInput {
  afterState: String
  beforeState: String!
}

input OuterWitnessesFromAuxesInput {
  auxes: [String!]!
}

type Query {
  commitAsePastSlot(slot: Int!): CommitAsePastSlotResult
  ethereumAssetRegistry(
    input: EthereumAssetRegistryInput
  ): EthereumAssetRegistrySnapshot
  innerActions(input: InnerActionsInput!): [InnerAction!]
  innerWitnessesFromAuxes(input: InnerWitnessesFromAuxesInput!): [InnerAction!]
  outerActions(input: OuterActionsInput!): [OuterActionUnion!]
  outerWitnessesFromAuxes(input: OuterWitnessesFromAuxesInput!): [Witness!]
}

type Witness implements OuterAction {
  afterState: String
  aux: String
  beforeState: String
  blockHeight: Int
  fields: [String!]
  finalityStatus: String
  index: Int
  kind: OuterActionKind
  markedAsCanonicalAt: String
  slotRangeLower: String
  slotRangeUpper: String
  timestamp: String
  txnHash: String
}

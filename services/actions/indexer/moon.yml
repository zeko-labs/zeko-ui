id: actions-indexer
layer: library
language: typescript
stack: backend
fileGroups:
  sources:
    - src/**/*
    - scripts/**/*
    - moon.yml
    - package.json
    - tsconfig.json
  tests:
    - test/**/*
dependsOn:
  - actions-api
  - graphql
  - bridge-sdk
tasks:
  format:
    inputs:
      - "@group(sources)"
      - "@group(tests)"
  format-fix:
    inputs:
      - "@group(sources)"
      - "@group(tests)"
  dev:
    command: bun --watch src/index.ts
    preset: server
  build:
    command: tsdown
    deps:
      - ^:build
    inputs:
      - "@group(sources)"
    outputs:
      - dist/index.js
  start:
    command: bun src/index.ts
    preset: server
  typecheck:
    deps:
      - ^:build
    command: tsc --noEmit -p tsconfig.json
    inputs:
      - "@group(sources)"
      - "@group(tests)"
  lint:
    command: biome check --formatter-enabled=false
    inputs:
      - "@group(sources)"
      - "@group(tests)"
  lint-fix:
    command: biome check --formatter-enabled=false --write
    inputs:
      - "@group(sources)"
      - "@group(tests)"

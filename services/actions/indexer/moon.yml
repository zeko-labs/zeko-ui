id: actions-indexer
layer: library
language: typescript
stack: backend
fileGroups:
  sources:
    - src/**/*
    - scripts/**/*
    - moon.yml
    - package.json
    - tsconfig.json
    - tsdown.config.ts
  tests:
    - test/**/*
dependsOn:
  - actions-api
  - graphql
  - bridge-sdk
tasks:
  format:
    inputs:
      - "@group(sources)"
      - "@group(tests)"
  format-fix:
    inputs:
      - "@group(sources)"
      - "@group(tests)"
  dev:
    command: bun --watch src/index.ts
    preset: server
  build:
    command: tsdown
    deps:
      - ^:build
    inputs:
      - "@group(sources)"
    outputs:
      - dist/index.js
      - dist/cli.js
      - dist/action-processing-process.js
  start:
    deps:
      - build
    command: node dist/index.js
    preset: server
  cli:
    deps:
      - build
    command: node dist/cli.js
    inputs:
      - "@group(sources)"
  diagnose:
    deps:
      - build
    command: node dist/cli.js diagnose
    inputs:
      - "@group(sources)"
  diagnose-health:
    deps:
      - build
    command: node dist/cli.js health
    inputs:
      - "@group(sources)"
  diagnose-sync:
    deps:
      - build
    command: node dist/cli.js sync
    inputs:
      - "@group(sources)"
  diagnose-resources:
    deps:
      - build
    command: node dist/cli.js resources
    inputs:
      - "@group(sources)"
  bench-action-processing:
    deps:
      - build
    command: node dist/cli.js action-processing-bench
    inputs:
      - "@group(sources)"
      - "@group(tests)"
  stress-action-processing:
    deps:
      - build
    command: node dist/cli.js action-processing-stress
    inputs:
      - "@group(sources)"
      - "@group(tests)"
  prove-action-processing:
    deps:
      - build
    command: node dist/cli.js action-processing-proof
    inputs:
      - "@group(sources)"
      - "@group(tests)"
  test-service-integration:
    deps:
      - build
    command: pnpm --filter @zeko/actions-indexer exec vitest run test/service.integration.test.ts
    inputs:
      - "@group(sources)"
      - "@group(tests)"
  typecheck:
    deps:
      - ^:build
    command: tsc --noEmit -p tsconfig.json
    inputs:
      - "@group(sources)"
      - "@group(tests)"
  lint:
    command: biome check --formatter-enabled=false
    inputs:
      - "@group(sources)"
      - "@group(tests)"
  lint-fix:
    command: biome check --formatter-enabled=false --write
    inputs:
      - "@group(sources)"
      - "@group(tests)"

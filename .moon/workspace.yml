# yaml-language-server: $schema=./cache/schemas/workspace.json

projects:
  - "."
  - "apps/*"
  - "packages/*"
  - "services/*/moon.yml"
  - "services/leaderboard/*"
  - "services/actions/*"
  - "services/proxies/*"

pipeline:
  logRunningCommand: true

vcs:
  client: "git"
  defaultBranch: "main"

# yaml-language-server: $schema=./cache/schemas/workspace.json

projects:
  - "."
  - "apps/*"
  - "packages/*"
  - "services/*/moon.yml"
  - "services/leaderboard/*"
  - "services/actions/*"

pipeline:
  installDependencies: false
  logRunningCommand: true

vcs:
  manager: "git"
  defaultBranch: "main"

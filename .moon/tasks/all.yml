taskOptions:
  runInCI: false
tasks:
  format:
    command: dprint check
    options:
      runInCI: true
  format-fix:
    command: dprint fmt --allow-no-files
  test:
    options:
      runInCI: true
  build:
    options:
      runInCI: true
  lint:
    options:
      runInCI: true
  lint-fix:
    options:
      cache: false
  typecheck:
    options:
      runInCI: true

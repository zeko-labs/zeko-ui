taskOptions:
  runInCI: false
tasks:
  format:
    script: biome format --files-ignore-unknown=true . && dprint check
    options:
      runInCI: true
  format-fix:
    script: biome format --files-ignore-unknown=true --write . && dprint fmt --allow-no-files
  test:
    options:
      runInCI: true
  build:
    options:
      runInCI: true
  lint:
    options:
      runInCI: true
  lint-fix:
    options:
      cache: false
  typecheck:
    options:
      runInCI: true

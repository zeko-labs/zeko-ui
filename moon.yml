layer: tool
tasks:
  format-all:
    script: biome format --files-ignore-unknown=true --html-formatter-enabled=false . && dprint check --allow-no-files
    options:
      cache: false
  format-all-fix:
    script: biome format --files-ignore-unknown=true --html-formatter-enabled=false --write . && dprint fmt --allow-no-files
    options:
      cache: false

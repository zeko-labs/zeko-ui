# yaml-language-server: $schema=../../.moon/cache/schemas/project.json

layer: tool

fileGroups:
  skill:
    - README.md
    - TESTING.md
    - zeko/**/*
    - src/**/*
    - evals/**/*
    - tests/**/*
    - package.json
    - tsconfig.json
    - tsconfig.build.json
    - vitest.config.ts
    - moon.yml

tasks:
  build:
    command: tsgo -p tsconfig.build.json
    inputs:
      - "@group(skill)"
    outputs:
      - dist/**/*
  test:
    command: vitest run
    inputs:
      - "@group(skill)"
  typecheck:
    command: tsgo --noEmit --declaration false --declarationMap false
    inputs:
      - "@group(skill)"
  validate:
    command: node dist/cli.js validate
    deps:
      - build
    inputs:
      - "@group(skill)"
  validate-public-install:
    command: node dist/cli.js validate-public-install
    deps:
      - build
    inputs:
      - "@group(skill)"
  eval-opencode:
    command: node dist/cli.js eval-opencode
    deps:
      - build
    inputs:
      - "@group(skill)"
  publish-clawhub:
    command: node dist/cli.js publish-clawhub
    deps:
      - check
    inputs:
      - "@group(skill)"
  check:
    command: node dist/cli.js check
    deps:
      - build
      - test
    inputs:
      - "@group(skill)"
    options:
      runInCI: true

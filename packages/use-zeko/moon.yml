# yaml-language-server: $schema=../../.moon/cache/schemas/project.json

layer: tool

fileGroups:
  skill:
    - README.md
    - SKILL.md
    - references/**/*
    - src/**/*
    - evals/**/*
    - tests/**/*
    - package.json
    - tsconfig.json
    - tsconfig.build.json
    - vitest.config.ts
    - moon.yml

tasks:
  build:
    command: tsc -p tsconfig.build.json
    inputs:
      - "@group(skill)"
    outputs:
      - dist/**/*
  test:
    command: vitest run
    inputs:
      - "@group(skill)"
  typecheck:
    command: tsc --noEmit
    inputs:
      - "@group(skill)"
  sync-sources:
    command: node dist/cli.js sync-sources
    deps:
      - build
    inputs:
      - "@group(skill)"
  validate:
    command: node dist/cli.js validate
    deps:
      - sync-sources
      - build
    inputs:
      - "@group(skill)"
  eval:
    command: node dist/cli.js eval
    deps:
      - build
    inputs:
      - "@group(skill)"
  check:
    command: node dist/cli.js check
    deps:
      - sync-sources
      - test
    inputs:
      - "@group(skill)"

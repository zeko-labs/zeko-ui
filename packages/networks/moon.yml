layer: library
fileGroups:
  src:
    - src/**/*
    - tests/**/*
    - package.json
    - tsconfig.json
    - tsconfig.build.json
    - tsdown.config.ts
    - moon.yml
tasks:
  build:
    command: tsdown
    inputs:
      - "@group(src)"
    outputs:
      - dist/**
  lint:
    command: biome check --formatter-enabled=false src tests
    inputs:
      - "@group(src)"
  lint-fix:
    command: biome check --formatter-enabled=false --write src tests
    inputs:
      - "@group(src)"
  typecheck:
    command: tsc --noEmit
    inputs:
      - "@group(src)"
  test:
    deps:
      - build
    command: vitest run
    inputs:
      - "@group(src)"

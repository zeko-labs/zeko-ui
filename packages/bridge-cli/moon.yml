# yaml-language-server: $schema=../../.moon/cache/schemas/project.json

layer: tool

fileGroups:
  src:
    - src/**/*
    - tests/**/*
    - README.md
    - testing.md
    - AGENTS.md
    - CLAUDE.md
    - .env.example
    - scripts/**/*
    - moon.yml
    - package.json
    - tsconfig.json
    - tsconfig.build.json
    - tsdown.config.ts
    - vitest.config.ts

tasks:
  build:
    command: tsdown
    inputs:
      - "@group(src)"
    outputs:
      - dist/**
  lint:
    command: biome lint --diagnostic-level=error
    inputs:
      - "@group(src)"
  lint-fix:
    command: biome lint --fix --unsafe --diagnostic-level=error
    inputs:
      - "@group(src)"
  typecheck:
    command: tsc --noEmit
    inputs:
      - "@group(src)"
  test:
    command: vitest run
    inputs:
      - "@group(src)"
  live-bridge-mina-to-zeko:
    description: Manual real-network validation of the high-level bridge command from Mina testnet to Zeko testnet.
    deps:
      - build
    command: bun ./scripts/run-live-bridge.ts mina:testnet zeko:testnet deposit
    options:
      cache: false
      runInCI: false
    inputs:
      - "@group(src)"
  live-bridge-zeko-to-mina:
    description: Manual real-network validation of the high-level bridge command from Zeko testnet to Mina testnet.
    deps:
      - build
    command: bun ./scripts/run-live-bridge.ts zeko:testnet mina:testnet withdrawal
    options:
      cache: false
      runInCI: false
    inputs:
      - "@group(src)"

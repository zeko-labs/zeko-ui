layer: application
dependsOn:
  - design
  - layer
fileGroups:
  sources:
    - src/**/*
    - scripts/**/*
    - .musea/cssforge-tokens.json
    - index.html
    - package.json
    - tsconfig.json
    - vite.config.ts
tasks:
  format:
    inputs:
      - "@group(sources)"
  format-fix:
    inputs:
      - "@group(sources)"
  lint:
    command: biome lint --diagnostic-level=error
    inputs:
      - "@globs(sources)"
  lint-fix:
    command: biome lint --fix --unsafe --diagnostic-level=error
    inputs:
      - "@globs(sources)"
  tokens:
    script: |
      node --experimental-strip-types scripts/generate-cssforge-tokens.ts
      pnpm exec biome format --files-ignore-unknown=true --write .musea/cssforge-tokens.json
    deps:
      - layer:cssforge
    options:
      runInCI: true
    inputs:
      - scripts/generate-cssforge-tokens.ts
      - /packages/design/src/**/*
      - /packages/layer/.cssforge/output.ts
    outputs:
      - .musea/cssforge-tokens.json
  dev:
    command: vite --host 127.0.0.1 --port 6077
    preset: server
    deps:
      - tokens
    inputs:
      - "@group(sources)"
  build:
    command: vite build
    deps:
      - tokens
      - ^:build
    inputs:
      - "@group(sources)"
      - /packages/layer/app/**/*
    outputs:
      - dist/
  typecheck:
    command: vue-tsc --noEmit
    deps:
      - tokens
    inputs:
      - "@group(sources)"
      - /packages/layer/app/**/*

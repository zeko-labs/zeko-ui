layer: library
dependsOn:
  - design
fileGroups:
  sources:
    - app/**/*
    - components/**/*
    - playground/**/*
    - nuxt.config.ts
    - playground/nuxt.config.ts
    - tsconfig.json
    - cssforge.config.ts
    - package.json
tasks:
  format:
    inputs:
      - "@group(sources)"
  format-fix:
    inputs:
      - "@group(sources)"
  cssforge:
    script: |
      node node_modules/@hebilicious/cssforge/src/cli --css app/assets/styles/cssforge.css
      pnpm exec biome format --files-ignore-unknown=true --write .cssforge/output.json .cssforge/output.ts app/assets/styles/cssforge.css
    deps:
      - design:build
    options:
      runInCI: true
    inputs:
      - "@group(sources)"
      - /packages/design/src/**/*
      - /packages/design/package.json
    outputs:
      - .cssforge/
      - app/assets/styles/cssforge.css
  dev:
    command: nuxi dev playground
    inputs:
      - "@group(sources)"
  prepare:
    command: nuxt prepare playground
    inputs:
      - "@group(sources)"
    outputs:
      - playground/.nuxt/

# yaml-language-server: $schema=../../.moon/cache/schemas/project.json

layer: library

dependsOn:
  - design

fileGroups:
  sources:
    - app/**/*
    - components/**/*
    - playground/**/*
    - nuxt.config.ts
    - playground/nuxt.config.ts
    - tsconfig.json
    - cssforge.config.ts
    - package.json
tasks:
  format:
    inputs:
      - "@group(sources)"
  format-fix:
    inputs:
      - "@group(sources)"
  cssforge:
    command: node node_modules/@hebilicious/cssforge/src/cli --css app/assets/styles/cssforge.css
    deps: ["design:build"]
    inputs:
      - "@group(sources)"
      - /apps/design/src/**/*
      - /apps/design/package.json
    outputs:
      - .cssforge/
      - app/assets/styles/cssforge.css
  dev:
    command: nuxi dev playground
    inputs:
      - "@group(sources)"
  prepare:
    command: nuxt prepare playground
    inputs:
      - "@group(sources)"
    outputs:
      - playground/.nuxt/

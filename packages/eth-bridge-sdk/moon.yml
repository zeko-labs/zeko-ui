layer: library
fileGroups:
  src:
    - src/**/*
    - tsconfig.json
    - tsconfig.build.json
    - tsdown.config.ts
    - package.json
  examples:
    - examples/**/*
  tests:
    - test/**/*
dependsOn:
  - bridge-sdk
tasks:
  build:
    command: tsdown
    deps:
      - ^:build
    inputs:
      - "@globs(src)"
    outputs:
      - dist/**/*
  typecheck:
    deps:
      - ^:build
      - build
    command: tsgo --noEmit --declaration false --declarationMap false
    inputs:
      - "@globs(src)"
      - "@globs(tests)"
  test:
    deps:
      - ^:build
    command: pnpm exec vitest run
    inputs:
      - "@globs(src)"
      - "@globs(tests)"
  lint:
    command: biome check --formatter-enabled=false
    inputs:
      - "@globs(src)"
      - "@globs(examples)"
      - "@globs(tests)"
  lint-fix:
    command: biome check --formatter-enabled=false --write
    inputs:
      - "@globs(src)"
      - "@globs(examples)"
      - "@globs(tests)"
  example:
    command: bun examples/headless.ts
    options:
      cache: false
  e2e:
    command: bun examples/e2e.ts
    deps:
      - ^:build
    options:
      cache: false
  live-sequencer-e2e:
    command: node examples/live-sequencer-e2e.ts
    deps:
      - ^:build
      - build
    options:
      cache: false
  erc20-identity:
    command: bun examples/erc20-identity.ts
    deps:
      - ^:build
    options:
      cache: false
  asset-record-batch:
    command: bun examples/asset-record-batch.ts
    deps:
      - ^:build
      - build
    options:
      cache: false

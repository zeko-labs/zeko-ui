id: cloudflare-build-config
layer: tool
fileGroups:
  src:
    - src/**/*
    - tests/**/*
    - schema/**/*
    - README.md
    - moon.yml
    - package.json
    - tsconfig.json
    - "/scripts/check-workflow-moon-run.ts"
  workflows:
    - "/.github/workflows/*.yaml"
    - "/.github/workflows/*.yml"
tasks:
  format:
    inputs:
      - "@group(src)"
  format-fix:
    inputs:
      - "@group(src)"
  lint:
    command: biome check --formatter-enabled=false src tests ../../scripts/check-workflow-moon-run.ts
    inputs:
      - "@group(src)"
  lint-fix:
    command: biome check --formatter-enabled=false --write src tests ../../scripts/check-workflow-moon-run.ts
    inputs:
      - "@group(src)"
  test:
    command: vitest run
    inputs:
      - "@group(src)"
      - "@group(workflows)"
  typecheck:
    command: tsgo --noEmit --declaration false --declarationMap false -p tsconfig.json
    inputs:
      - "@group(src)"
  sync:
    command: node src/cli.ts
    options:
      cache: false
  sync-dry-run:
    command: node src/cli.ts --dry-run
    options:
      cache: false
  dump-tokens:
    command: node src/cli.ts dump-tokens
    options:
      cache: false

layer: application
dependsOn:
  - design
  - layer
fileGroups:
  sources:
    - app/**
    - helpers/**
    - public/**
    - server/**
    - nuxt.config.ts
    - tsconfig.json
    - package.json
tasks:
  format:
    inputs:
      - "@group(sources)"
  format-fix:
    inputs:
      - "@group(sources)"
  lint:
    command: biome lint --diagnostic-level=error
    inputs:
      - "@globs(sources)"
  lint-fix:
    command: biome lint --fix --unsafe --diagnostic-level=error
    inputs:
      - "@globs(sources)"
  dev:
    command: nuxt dev
  build:
    command: nuxt build
    inputs:
      - "@globs(sources)"
    outputs:
      - .nuxt/
      - .output/
  type-cf:
    command: wrangler types
    inputs:
      - wrangler.jsonc
    outputs:
      - worker-configuration.d.ts
  publish-cf-build-config:
    description: Publish the checked-in Cloudflare Workers Build config for this project.
    script: pnpm exec moon run cloudflare-build-config:sync -- apps/faucet-ui/workers-build.jsonc
    options:
      cache: false
  dev-cf:
    command: wrangler dev .output/server/index.mjs --assets .output/public/
    preset: server
    deps:
      - build
    inputs:
      - .output/
  preview:
    command: nuxt preview
    preset: server
  prepare:
    command: nuxt prepare
    outputs:
      - .nuxt/
  deploy-dev:
    description: Build and Deploy to Cloudflare Workers. Use with caution, prefer using CI/CD.
    script: rimraf .output .wrangler .nuxt && nuxt build && wrangler deploy
    inputs:
      - "@globs(sources)"
    outputs:
      - .nuxt/
      - .output/
      - .wrangler/
  deploy:
    command: wrangler deploy
    deps:
      - build
  deploy-preview:
    command: wrangler versions upload
    deps:
      - build

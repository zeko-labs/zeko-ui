layer: application
fileGroups:
  sources:
    - content/**/*
    - .vitepress/**/*
    - worker.ts
    - package.json
  test:
    - tests/**/*
    - vitest.config.ts
tasks:
  dev:
    command: vitepress dev
  build:
    command: vitepress build
    inputs:
      - "@globs(sources)"
    outputs:
      - .vitepress/dist/**
  type-cf:
    command: wrangler types
    inputs:
      - wrangler.jsonc
    outputs:
      - worker-configuration.d.ts
  preview:
    command: vitepress preview
    preset: server
    deps:
      - build
  deploy:
    command: wrangler deploy
    deps:
      - build
  deploy-preview:
    command: wrangler versions upload
    deps:
      - build
  test:
    command: vitest run
    inputs:
      - "@group(sources)"
      - "@group(test)"

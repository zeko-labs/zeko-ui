layer: application
dependsOn:
  - networks
fileGroups:
  sources:
    - content/**/*
    - .vitepress/**/*
    - worker.ts
    - package.json
  test:
    - tests/**/*
    - vitest.config.ts
tasks:
  dev:
    script: mkdir -p d2-diagrams && touch d2-diagrams/temp.d2 && vitepress dev
  build:
    script: mkdir -p d2-diagrams && touch d2-diagrams/temp.d2 && vitepress build
    inputs:
      - "@globs(sources)"
      - /packages/bridge-sdk/README.md
      - /packages/bridge-cli/README.md
      - /packages/faucet-cli/README.md
    outputs:
      - .vitepress/dist/**
  type-cf:
    command: wrangler types
    inputs:
      - wrangler.jsonc
    outputs:
      - worker-configuration.d.ts
  publish-cf-build-config:
    description: Publish the checked-in Cloudflare Workers Build config for this project.
    script: pnpm exec moon run cloudflare-build-config:sync -- apps/docs/workers-build.jsonc
    options:
      cache: false
  preview:
    command: vitepress preview
    preset: server
    deps:
      - build
  deploy:
    command: wrangler deploy
    deps:
      - build
  deploy-preview:
    command: wrangler versions upload
    deps:
      - build
  test:
    command: vitest run
    inputs:
      - "@group(sources)"
      - "@group(test)"

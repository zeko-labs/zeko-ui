layer: application
dependsOn:
  - design
  - layer
  - bridge-sdk
  - sdk
fileGroups:
  sources:
    - app/**/*
    - public/**/*
    - server/**/*
    - machines/**/*
    - observability/**/*
    - worker-configuration.d.ts
    - sentry.client.config.ts
    - global.d.ts
    - nuxt.config.ts
    - tsconfig.json
    - package.json
  test:
    - tests/**/*
    - vitest.config.ts
tasks:
  format:
    inputs:
      - "@group(sources)"
  format-fix:
    inputs:
      - "@group(sources)"
  lint:
    command: biome lint --diagnostic-level=error
    inputs:
      - "@globs(sources)"
  lint-fix:
    command: biome lint --fix --unsafe --diagnostic-level=error
    inputs:
      - "@globs(sources)"
  dev:
    command: nuxt dev
    preset: server
  build:
    command: nuxt build
    deps:
      - ^:build
    args:
      - --logLevel
      - verbose
    env:
      SENTRY_LOG_LEVEL: debug
      NODE_OPTIONS: --max-old-space-size=8192
    inputs:
      - "@group(sources)"
    outputs:
      - .nuxt/
      - .output/
  dev-cf:
    command: wrangler dev .output/server/index.mjs --assets .output/public/
    preset: server
    deps:
      - build
    inputs:
      - .output/
  type-cf:
    command: wrangler types
    inputs:
      - wrangler.jsonc
    outputs:
      - worker-configuration.d.ts
  publish-cf-build-config:
    description: Publish the checked-in Cloudflare Workers Build config for this project.
    script: pnpm exec moon run cloudflare-build-config:sync -- apps/bridge-ui/workers-build.jsonc
    options:
      cache: false
  preview:
    command: nuxt preview
    preset: server
  prepare:
    command: nuxt prepare
    outputs:
      - .nuxt/
  analyze:
    command: nuxt analyze
    preset: server
  deploy:
    description: Run the CI deploy flow for the default testnet target, including Sentry release and Cloudflare deploy logic.
    command: nu
    args:
      - ./deploy-ci.nu
    env:
      BRIDGE_UI_DEPLOY_TARGET: testnet
    options:
      cache: false
      runInCI: false
  deploy-testnet:
    description: Run the CI deploy flow for the testnet target.
    command: nu
    args:
      - ./deploy-ci.nu
    env:
      BRIDGE_UI_DEPLOY_TARGET: testnet
    options:
      cache: false
      runInCI: false
  deploy-mainnet:
    description: Run the CI deploy flow for the mainnet target.
    command: nu
    args:
      - ./deploy-ci.nu
    env:
      BRIDGE_UI_DEPLOY_TARGET: mainnet
    options:
      cache: false
      runInCI: false
  deploy-preview:
    description: Run the CI deploy flow for non-production branches.
    command: nu
    args:
      - ./deploy-ci.nu
    env:
      BRIDGE_UI_DEPLOY_TARGET: preview
    options:
      cache: false
      runInCI: false
  deploy-dev:
    description: Build and Deploy to Cloudflare Workers. Use with caution, prefer using CI/CD.
    script: rimraf .output .wrangler .nuxt && nuxt build && wrangler deploy
    inputs:
      - "@group(sources)"
    outputs:
      - .nuxt/
      - .output/
      - .wrangler/
  typecheck:
    command: nuxt typecheck
    deps:
      - ^:build
    inputs:
      - "@group(sources)"
  test:
    command: vitest run
    inputs:
      - "@group(sources)"
      - "@group(test)"
    options:
      runInCI: false
  playwright-install:
    command: playwright install chromium --with-deps
    options:
      runInCI: true
  test-ci:
    extends: test
    deps:
      - playwright-install
    options:
      runInCI: true
  metrics-report:
    script: BRIDGE_METRICS_WORKSPACE_DIR=./observability/bridge-metrics ./observability/bridge-metrics/analytics-engine/scripts/run-all.sh --dry-run
    inputs:
      - "@group(sources)"
    options:
      cache: false
  metrics-report-live:
    script: BRIDGE_METRICS_WORKSPACE_DIR=./observability/bridge-metrics ./observability/bridge-metrics/analytics-engine/scripts/run-all.sh
    inputs:
      - "@group(sources)"
    options:
      cache: false
  grafana-dashboard-generate:
    command: node --experimental-strip-types ./observability/bridge-metrics/grafana/scripts/generate-dashboard.ts
    inputs:
      - "@group(sources)"
    options:
      cache: false
  sentry-errors-csv:
    command: node --experimental-strip-types ./observability/bridge-metrics/sentry/scripts/export-errors-csv.ts
    inputs:
      - "@group(sources)"
    options:
      cache: false
  sentry:
    command: "sentry-cli"
    options:
      cache: false
  test-watch:
    command: vitest
    preset: server

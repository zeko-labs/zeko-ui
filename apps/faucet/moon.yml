layer: application
tasks:
  container-dev:
    command: bun --hot src/index.ts
    preset: server
  container-start:
    command: bun src/index.ts
    preset: server
  dev:
    command: wrangler dev
  test:
    command: vitest run
    inputs:
      - tsconfig.json
      - worker.ts
      - worker/**/*.ts
      - worker-configuration.d.ts
      - test/**/*.ts
      - test/tsconfig.json
      - vitest.config.ts
  typecheck:
    command: tsc --noEmit -p test/tsconfig.json
    inputs:
      - tsconfig.json
      - worker.ts
      - worker/**/*.ts
      - worker-configuration.d.ts
      - src/**/*.ts
      - test/**/*.ts
      - test/tsconfig.json
  type-cf:
    command: wrangler types
    inputs:
      - wrangler.jsonc
    outputs:
      - worker-configuration.d.ts
  publish-cf-build-config:
    description: Publish the checked-in Cloudflare Workers Build config for this project.
    script: pnpm exec moon run cloudflare-build-config:sync -- apps/faucet/workers-build.jsonc
    options:
      cache: false
  deploy:
    command: wrangler deploy
  deploy-preview:
    command: wrangler versions upload

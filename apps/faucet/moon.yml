# yaml-language-server: $schema=../../.moon/cache/schemas/project.json

layer: application

tasks:
  container-dev:
    command: bun --hot src/index.ts
  container-start:
    command: bun src/index.ts
  dev:
    command: wrangler dev
  test:
    command: vitest run
    inputs:
      - tsconfig.json
      - worker.ts
      - worker/**/*.ts
      - worker-configuration.d.ts
      - test/**/*.ts
      - test/tsconfig.json
      - vitest.config.ts
  typecheck:
    command: tsc --noEmit -p test/tsconfig.json
    inputs:
      - tsconfig.json
      - worker.ts
      - worker/**/*.ts
      - worker-configuration.d.ts
      - src/**/*.ts
      - test/**/*.ts
      - test/tsconfig.json
  type-cf:
    command: wrangler types
    inputs:
      - wrangler.jsonc
    outputs:
      - worker-configuration.d.ts
  deploy:
    command: wrangler deploy
  deploy-preview:
    command: wrangler versions upload

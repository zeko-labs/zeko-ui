name: Moonrepo Setup And Cache
description: Set up Moonrepo toolchain with cache.

runs:
  using: composite
  steps:
    - name: Cache Moonrepo
      uses: actions/cache@v4
      with:
        path: .moon/cache
        key: ${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-

    - uses: "moonrepo/setup-toolchain@v0"

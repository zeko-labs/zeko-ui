name: Actions API Testnet Migrations

on:
  push:
    branches: ["main"]
    paths:
      - "services/actions/api/drizzle/**"
      - "services/actions/api/drizzle.config.ts"
      - "services/actions/api/scripts/migrate.ts"
      - "services/actions/api/src/helpers/utils.ts"

jobs:
  migrate-testnet:
    name: Migrate Testnet
    runs-on: warp-ubuntu-latest-x64-2x
    concurrency:
      group: actions-migrate-testnet
      cancel-in-progress: false
    env:
      DATABASE_URL: ${{ secrets.ACTIONS_TESTNET_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run migrations
        run: moon exec --ignore-ci-checks actions-api:db-migrate -- --force

name: GitHub Release Bridge CLI

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

jobs:
  github-release:
    runs-on: warp-ubuntu-latest-x64-2x
    name: Create GitHub Release
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.ZEKO_LABS_GH_APP_ID }}
          private-key: ${{ secrets.ZEKO_LABS_GH_APP_PRIVATE_KEY }}
          owner: zeko-labs
          repositories: bridge-cli

      - name: Download packaged tarball
        uses: actions/download-artifact@v4
        with:
          name: bridge-cli-package
          path: release/

      - name: Create release on standalone repo
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          if gh release view "v${VERSION}" --repo zeko-labs/bridge-cli >/dev/null 2>&1; then
            echo "v${VERSION} already exists on zeko-labs/bridge-cli; uploading assets and skipping create."
            gh release upload "v${VERSION}" release/* \
              --repo zeko-labs/bridge-cli \
              --clobber
            exit 0
          fi

          gh release create "v${VERSION}" release/* \
            --repo zeko-labs/bridge-cli \
            --target main \
            --title "v${VERSION}" \
            --notes "Published from monorepo. See [npm package](https://www.npmjs.com/package/@zeko-labs/bridge-cli/v/${VERSION})." \
            --latest

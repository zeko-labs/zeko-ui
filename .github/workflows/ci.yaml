name: CI Everything

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  format:
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
      checks: write
      statuses: write
      deployments: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Moonrepo
        uses: actions/cache@v4
        with:
          path: .moon/cache
          key: ${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-

      - uses: "moonrepo/setup-toolchain@v0"

      - run: "moon ci"

      - uses: "moonrepo/run-report-action@v1"
        if: success() || failure()
        with:
          access-token: ${{ secrets.GITHUB_TOKEN }}

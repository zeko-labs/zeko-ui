name: CI Everything

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  ci:
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
      checks: write
      statuses: write
      deployments: write
    runs-on: warp-ubuntu-latest-x64-8x
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install D2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL https://d2lang.com/install.sh | sh -s --

      - uses: "moonrepo/setup-toolchain@v0"
        with:
          auto-install: true

      - run: moon ci

      - uses: "moonrepo/run-report-action@v1"
        if: success() || failure()
        with:
          matrix: '{"ci":"ci"}'
          access-token: ${{ secrets.GITHUB_TOKEN }}

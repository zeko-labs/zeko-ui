name: Sync Bridge SDK

on:
  workflow_call:
  workflow_dispatch:

jobs:
  sync:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.ZEKO_LABS_GH_APP_ID }}
          private-key: ${{ secrets.ZEKO_LABS_GH_APP_PRIVATE_KEY }}
          owner: zeko-labs
          repositories: bridge-sdk

      - name: Resolve catalog and workspace dependencies
        run: |
          node -e "
          const fs = require('fs');

          const workspace = fs.readFileSync('pnpm-workspace.yaml', 'utf8');
          const defaultCatalog = {};
          const namedCatalogs = {};
          let section = null;
          let activeCatalog = null;

          for (const line of workspace.split('\n')) {
            const trimmed = line.trim();
            if (trimmed === 'catalog:') {
              section = 'catalog';
              activeCatalog = null;
              continue;
            }
            if (trimmed === 'catalogs:') {
              section = 'catalogs';
              activeCatalog = null;
              continue;
            }
            if (/^\S/.test(line)) {
              section = null;
              activeCatalog = null;
              continue;
            }
            if (section === 'catalog') {
              const match = line.match(/^  ['\"]?(.+?)['\"]?:\s+(.+?)$/);
              if (!match) continue;
              defaultCatalog[match[1].replace(/['\"]$/g, '').trim()] = match[2]
                .replace(/^['\"]|['\"]$/g, '')
                .trim();
              continue;
            }
            if (section === 'catalogs') {
              const header = line.match(/^  ([^:\s]+):\s*$/);
              if (header) {
                activeCatalog = header[1];
                namedCatalogs[activeCatalog] = namedCatalogs[activeCatalog] ?? {};
                continue;
              }
              if (!activeCatalog) continue;
              const match = line.match(/^    ['\"]?(.+?)['\"]?:\s+(.+?)$/);
              if (!match) continue;
              namedCatalogs[activeCatalog][match[1].replace(/['\"]$/g, '').trim()] = match[2]
                .replace(/^['\"]|['\"]$/g, '')
                .trim();
            }
          }

          const localVersions = {
            '@zeko/graphql': JSON.parse(fs.readFileSync('packages/graphql/package.json', 'utf8')).version,
            '@zeko-labs/bridge-sdk': JSON.parse(fs.readFileSync('packages/bridge-sdk/package.json', 'utf8')).version
          };

          const file = 'packages/bridge-sdk/package.json';
          const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));

          const resolveCatalog = (name, specifier) => {
            if (specifier === 'catalog:') {
              return defaultCatalog[name] ?? specifier;
            }
            if (!specifier.startsWith('catalog:')) {
              return specifier;
            }
            const catalogName = specifier.slice('catalog:'.length);
            if (!catalogName) {
              return defaultCatalog[name] ?? specifier;
            }
            return namedCatalogs[catalogName]?.[name] ?? specifier;
          };

          let changed = false;
          for (const sectionName of ['dependencies', 'devDependencies', 'optionalDependencies', 'peerDependencies']) {
            if (!pkg[sectionName]) continue;
            for (const [name, specifier] of Object.entries(pkg[sectionName])) {
              if (typeof specifier !== 'string') continue;
              if (specifier.startsWith('catalog:')) {
                const resolved = resolveCatalog(name, specifier);
                if (resolved !== specifier) {
                  pkg[sectionName][name] = resolved;
                  changed = true;
                }
                continue;
              }
              if (specifier.startsWith('workspace:')) {
                const range = specifier.slice('workspace:'.length);
                const version = localVersions[name];
                if (!version) continue;
                pkg[sectionName][name] =
                  range === '^' ? '^' + version :
                  range === '~' ? '~' + version :
                  range === '*' ? version :
                  version;
                changed = true;
              }
            }
          }

          if (changed) {
            fs.writeFileSync(file, JSON.stringify(pkg, null, '\t') + '\n');
          }
          "

      - name: Inject packageManager field
        run: |
          PM=$(node -p "require('./package.json').packageManager")
          node -e "
            const fs = require('fs');
            const file = 'packages/bridge-sdk/package.json';
            const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
            pkg.packageManager = '$PM';
            fs.writeFileSync(file, JSON.stringify(pkg, null, '\t') + '\n');
          "

      - name: Generate pnpm-workspace.yaml for standalone repo
        run: printf 'packages:\n  - .\n' > packages/bridge-sdk/pnpm-workspace.yaml

      - name: Force-push clean commit to standalone repo
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          REMOTE_URL="https://x-access-token:${GH_TOKEN}@github.com/zeko-labs/bridge-sdk.git"
          COMMIT_SHA=$(git rev-parse --short HEAD)

          tmp=$(mktemp -d)
          git init "$tmp"
          cp -a packages/bridge-sdk/. "$tmp/"
          cd "$tmp"
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync from monorepo (${COMMIT_SHA})"
          git push --force "$REMOTE_URL" HEAD:main

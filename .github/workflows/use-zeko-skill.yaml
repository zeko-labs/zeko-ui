name: Use Zeko Skill

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/use-zeko-skill.yaml"
      - "packages/use-zeko/**"
      - "apps/docs/**"
      - "packages/bridge-sdk/**"
      - "packages/faucet-cli/**"
      - "packages/graphql/**"
      - "apps/bridge-ui/machines/helpers.ts"
      - "services/mina-proxy/**"
      - "services/mina-archive-proxy/**"
      - "services/actions/api/**"
      - "docs/CODEBASE_MAP.md"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/use-zeko-skill.yaml"
      - "packages/use-zeko/**"
      - "apps/docs/**"
      - "packages/bridge-sdk/**"
      - "packages/faucet-cli/**"
      - "packages/graphql/**"
      - "apps/bridge-ui/machines/helpers.ts"
      - "services/mina-proxy/**"
      - "services/mina-archive-proxy/**"
      - "services/actions/api/**"
      - "docs/CODEBASE_MAP.md"
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

jobs:
  check:
    runs-on: warp-ubuntu-latest-x64-2x
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run use-zeko check
        run: moon run -f use-zeko:check

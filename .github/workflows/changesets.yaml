name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  id-token: write
  contents: write
  pull-requests: write

jobs:
  release:
    name: Changesets
    runs-on: ubuntu-latest
    outputs:
      hasChangesets: ${{ steps.changesets.outputs.hasChangesets }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - run: pnpm install --frozen-lockfile

      - id: changesets
        uses: changesets/action@v1
        with:
          title: "release: version packages"
          commit: "release: version packages"
          version: bun scripts/changeset-version.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ──────────────────────────────────────────────────────────
  # Downstream release jobs — one per publishable package group.
  #
  # Each workflow has its own version-check that compares against
  # the npm registry and skips if already published.
  #
  # We don't use changesets/action `publish` because some packages
  # need custom build or packaging steps before npm publish.
  # Each release workflow handles its own build + publish.
  #
  # To add a new publishable package:
  #   1. Create .github/workflows/release-<name>.yaml
  #      (with workflow_call + workflow_dispatch triggers)
  #   2. Add a job below that calls it.
  # ──────────────────────────────────────────────────────────

  release-faucet-cli:
    name: Release Faucet CLI
    needs: release
    if: needs.release.outputs.hasChangesets == 'false'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/release-faucet-cli.yaml
    secrets: inherit

  release-bridge-cli:
    name: Release Bridge CLI
    needs: release
    if: needs.release.outputs.hasChangesets == 'false'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/release-bridge-cli.yaml
    secrets: inherit

  release-graphql:
    name: Release GraphQL
    needs: release
    if: needs.release.outputs.hasChangesets == 'false'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/release-graphql.yaml
    secrets: inherit

  release-bridge-sdk:
    name: Release Bridge SDK
    needs: [release, release-graphql]
    if: needs.release.outputs.hasChangesets == 'false'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/release-bridge-sdk.yaml
    secrets: inherit

  sync-graphql:
    name: Sync GraphQL Mirror
    needs: [release, release-graphql]
    if: needs.release.outputs.hasChangesets == 'false'
    permissions:
      contents: read
    uses: ./.github/workflows/sync-graphql.yaml
    secrets: inherit

  sync-bridge-sdk:
    name: Sync Bridge SDK Mirror
    needs: [release, release-bridge-sdk]
    if: needs.release.outputs.hasChangesets == 'false'
    permissions:
      contents: read
    uses: ./.github/workflows/sync-bridge-sdk.yaml
    secrets: inherit

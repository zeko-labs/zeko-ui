name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  id-token: write
  contents: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    outputs:
      hasChangesets: ${{ steps.changesets.outputs.hasChangesets }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: moonrepo/setup-toolchain@v0

      - id: changesets
        uses: changesets/action@v1
        with:
          title: "release: version packages"
          commit: "release: version packages"
          version: pnpm changeset version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-faucet-cli:
    name: Release Faucet CLI
    needs: release
    if: needs.release.outputs.hasChangesets == 'false'
    uses: ./.github/workflows/release-faucet-cli.yaml
    secrets: inherit

  sync-faucet-cli:
    name: Sync Faucet CLI
    needs: release-faucet-cli
    if: always() && needs.release-faucet-cli.result == 'success'
    uses: ./.github/workflows/sync-faucet-cli.yaml
    secrets: inherit

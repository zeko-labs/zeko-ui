name: Release Faucet CLI

on:
  workflow_call:
  workflow_dispatch:

jobs:
  version-check:
    name: Check faucet-cli version
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Check if version is already published
        id: check
        run: |
          VERSION=$(node -p "require('./packages/faucet-cli/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          PUBLISHED=$(npm view @zeko-labs/faucet-cli@"$VERSION" version 2>/dev/null || echo "")
          if [ -z "$PUBLISHED" ] || [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "should_release=true" >> $GITHUB_OUTPUT
          else
            echo "should_release=false" >> $GITHUB_OUTPUT
          fi

  build:
    needs: version-check
    if: needs.version-check.outputs.should_release == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-apple-darwin
            runner: macos-15
            platform: darwin-x64
          - target: aarch64-apple-darwin
            runner: macos-14
            platform: darwin-arm64
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            platform: linux-x64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            platform: linux-arm64
            use_cross: true
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            platform: win32-x64
          - target: aarch64-pc-windows-msvc
            runner: windows-latest
            platform: win32-arm64

    runs-on: ${{ matrix.runner }}
    name: Build ${{ matrix.platform }}
    defaults:
      run:
        working-directory: packages/faucet-cli

    steps:
      - uses: actions/checkout@v4

      - name: Check for cached artifact
        id: cache
        uses: actions/cache@v4
        with:
          path: packages/faucet-cli/artifact/
          key: faucet-cli-${{ matrix.platform }}-${{ hashFiles('packages/faucet-cli/Cargo.lock', 'packages/faucet-cli/Cargo.toml', 'packages/faucet-cli/src/**') }}

      - uses: moonrepo/setup-toolchain@v0
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          auto-install: true

      - name: Add Rust target
        if: steps.cache.outputs.cache-hit != 'true'
        run: rustup target add ${{ matrix.target }}

      - name: Install cross (Linux arm64)
        if: matrix.use_cross && steps.cache.outputs.cache-hit != 'true'
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (native)
        if: "!matrix.use_cross && steps.cache.outputs.cache-hit != 'true'"
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.use_cross && steps.cache.outputs.cache-hit != 'true'
        run: cross build --release --target ${{ matrix.target }}

      - name: Prepare artifact (unix)
        if: runner.os != 'Windows' && steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p artifact
          cp target/${{ matrix.target }}/release/zeko-faucet artifact/

      - name: Prepare artifact (windows)
        if: runner.os == 'Windows' && steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir artifact
          copy target\${{ matrix.target }}\release\zeko-faucet.exe artifact\

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.platform }}
          path: packages/faucet-cli/artifact/
          retention-days: 1

  publish:
    needs: [version-check, build]
    runs-on: ubuntu-latest
    name: Publish to npm
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Copy binaries to platform packages
        working-directory: packages/faucet-cli
        run: |
          set -euo pipefail
          for platform in darwin-arm64 darwin-x64 linux-x64 linux-arm64 win32-x64 win32-arm64; do
            src="../../artifacts/binary-${platform}"
            dest="npm/${platform}/bin"
            mkdir -p "$dest"
            if [ -f "${src}/zeko-faucet" ]; then
              cp "${src}/zeko-faucet" "${dest}/"
              chmod +x "${dest}/zeko-faucet"
            elif [ -f "${src}/zeko-faucet.exe" ]; then
              cp "${src}/zeko-faucet.exe" "${dest}/"
            else
              echo "::error::Missing binary for ${platform}"
              exit 1
            fi
          done

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pack main package
        working-directory: packages/faucet-cli
        run: pnpm pack

      - name: Configure npm registry
        run: |
          echo "registry=https://registry.npmjs.org/" > "$HOME/.npmrc"
          echo "//registry.npmjs.org/:_authToken=\${NODE_AUTH_TOKEN}" >> "$HOME/.npmrc"

      - name: Publish platform packages
        working-directory: packages/faucet-cli
        env:
          NPM_CONFIG_PROVENANCE: "false"
        run: |
          set -euo pipefail
          for platform in darwin-arm64 darwin-x64 linux-x64 linux-arm64 win32-x64 win32-arm64; do
            PKG="@zeko-labs/faucet-cli-${platform}"
            VERSION=$(node -p "require('./npm/${platform}/package.json').version")
            PUBLISHED=$(npm view "${PKG}@${VERSION}" version 2>/dev/null || true)
            if [ -n "$PUBLISHED" ]; then
              echo "${PKG}@${VERSION} already published, skipping."
              continue
            fi
            echo "Publishing ${PKG}@${VERSION}..."
            npm publish "./npm/${platform}" --access public --loglevel verbose
          done

      - name: Publish main package
        working-directory: packages/faucet-cli
        env:
          NPM_CONFIG_PROVENANCE: "false"
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view "@zeko-labs/faucet-cli@${VERSION}" version 2>/dev/null || true)
          if [ -n "$PUBLISHED" ]; then
            echo "@zeko-labs/faucet-cli@${VERSION} already published, skipping."
          else
            npm publish "zeko-labs-faucet-cli-${VERSION}.tgz" --access public --loglevel verbose
          fi

  github-release:
    needs: [version-check, publish]
    uses: ./.github/workflows/github-release-faucet-cli.yaml
    with:
      version: ${{ needs.version-check.outputs.version }}
    secrets: inherit

  sync:
    needs: [version-check, publish]
    uses: ./.github/workflows/sync-faucet-cli.yaml
    secrets: inherit

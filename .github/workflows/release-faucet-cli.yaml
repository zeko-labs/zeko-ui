name: Release Faucet CLI

on:
  push:
    branches: [main]
    paths:
      - packages/faucet-cli/**
  workflow_dispatch:

jobs:
  version-check:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Check if version is already published
        id: check
        run: |
          VERSION=$(node -p "require('./packages/faucet-cli/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          PUBLISHED=$(npm view @zeko-labs/faucet-cli@"$VERSION" version 2>/dev/null || echo "")
          if [ -z "$PUBLISHED" ] || [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "Version $VERSION not yet published — will release"
          else
            echo "should_release=false" >> $GITHUB_OUTPUT
            echo "Version $VERSION already published — skipping"
          fi

  build:
    needs: version-check
    if: needs.version-check.outputs.should_release == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-apple-darwin
            runner: macos-13
            platform: darwin-x64
          - target: aarch64-apple-darwin
            runner: macos-14
            platform: darwin-arm64
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            platform: linux-x64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            platform: linux-arm64
            use_cross: true
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            platform: win32-x64
          - target: aarch64-pc-windows-msvc
            runner: windows-latest
            platform: win32-arm64

    runs-on: ${{ matrix.runner }}
    name: Build ${{ matrix.platform }}
    defaults:
      run:
        working-directory: packages/faucet-cli

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (Linux arm64)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (native)
        if: "!matrix.use_cross"
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.use_cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Prepare artifact (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p artifact
          cp target/${{ matrix.target }}/release/zeko-faucet artifact/

      - name: Prepare artifact (windows)
        if: runner.os == 'Windows'
        run: |
          mkdir artifact
          copy target\${{ matrix.target }}\release\zeko-faucet.exe artifact\

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.platform }}
          path: packages/faucet-cli/artifact/
          retention-days: 1

  publish:
    needs: [version-check, build]
    runs-on: ubuntu-latest
    name: Publish to npm
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Copy binaries to platform packages
        working-directory: packages/faucet-cli
        run: |
          for platform in darwin-arm64 darwin-x64 linux-x64 linux-arm64 win32-x64 win32-arm64; do
            src="../../artifacts/binary-${platform}"
            dest="npm/${platform}/bin"
            mkdir -p "$dest"
            if [ -f "${src}/zeko-faucet" ]; then
              cp "${src}/zeko-faucet" "${dest}/"
              chmod +x "${dest}/zeko-faucet"
            elif [ -f "${src}/zeko-faucet.exe" ]; then
              cp "${src}/zeko-faucet.exe" "${dest}/"
            fi
          done

      - name: Resolve workspace dependencies for publish
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const dir = 'packages/faucet-cli';
          const packageFiles = [path.join(dir, 'package.json')];
          const npmDir = path.join(dir, 'npm');
          if (fs.existsSync(npmDir)) {
            for (const sub of fs.readdirSync(npmDir)) {
              const pkgFile = path.join(npmDir, sub, 'package.json');
              if (fs.existsSync(pkgFile)) packageFiles.push(pkgFile);
            }
          }

          const localVersions = {};
          for (const file of packageFiles) {
            const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
            localVersions[pkg.name] = pkg.version;
          }

          const ws = fs.readFileSync('pnpm-workspace.yaml', 'utf8');
          const catalog = {};
          let inCatalog = false;
          for (const line of ws.split('\n')) {
            if (line.trim() === 'catalog:') { inCatalog = true; continue; }
            if (/^\S/.test(line) && inCatalog) { inCatalog = false; }
            if (inCatalog) {
              const m = line.match(/^\s+['\"]?(.+?)['\"]?:\s+(.+?)$/);
              if (m) {
                const name = m[1].replace(/['\"]$/g, '').trim();
                const version = m[2].replace(/^['\"]|['\"]$/g, '').trim();
                catalog[name] = version;
              }
            }
          }

          for (const file of packageFiles) {
            const raw = fs.readFileSync(file, 'utf8');
            const pkg = JSON.parse(raw);
            let changed = false;
            for (const section of ['dependencies', 'devDependencies', 'optionalDependencies']) {
              if (!pkg[section]) continue;
              for (const [name, specifier] of Object.entries(pkg[section])) {
                if (specifier === 'catalog:' && catalog[name]) {
                  pkg[section][name] = catalog[name];
                  changed = true;
                }
                if (specifier.startsWith('workspace:')) {
                  const range = specifier.slice('workspace:'.length);
                  const ver = localVersions[name];
                  if (ver) {
                    pkg[section][name] = range === '^' ? '^' + ver : range === '~' ? '~' + ver : ver;
                    changed = true;
                  }
                }
              }
            }
            if (changed) {
              const indent = raw.startsWith('{\n\t') ? '\t' : 2;
              fs.writeFileSync(file, JSON.stringify(pkg, null, indent) + '\n');
            }
          }
          "

      - name: Publish all packages
        working-directory: packages/faucet-cli
        run: node scripts/publish.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    needs: [version-check, publish]
    runs-on: ubuntu-latest
    name: GitHub Release
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.ZEKO_LABS_GH_APP_ID }}
          private-key: ${{ secrets.ZEKO_LABS_GH_APP_PRIVATE_KEY }}
          owner: zeko-labs
          repositories: faucet-cli

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Package release binaries
        run: |
          mkdir -p release
          VERSION="${{ needs.version-check.outputs.version }}"
          for platform in darwin-arm64 darwin-x64 linux-x64 linux-arm64 win32-x64 win32-arm64; do
            src="artifacts/binary-${platform}"
            if [ -f "${src}/zeko-faucet" ]; then
              tar -czf "release/zeko-faucet-v${VERSION}-${platform}.tar.gz" -C "${src}" zeko-faucet
            elif [ -f "${src}/zeko-faucet.exe" ]; then
              (cd "${src}" && zip "../../release/zeko-faucet-v${VERSION}-${platform}.zip" zeko-faucet.exe)
            fi
          done

      - name: Create release on standalone repo
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          VERSION="${{ needs.version-check.outputs.version }}"
          gh release create "v${VERSION}" release/* \
            --repo zeko-labs/faucet-cli \
            --title "v${VERSION}" \
            --notes "Published from monorepo. See [npm package](https://www.npmjs.com/package/@zeko-labs/faucet-cli/v/${VERSION})." \
            --latest

name: Sync Faucet CLI

on:
  workflow_call:
  workflow_dispatch:

jobs:
  sync:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: moonrepo/setup-toolchain@v0

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.ZEKO_LABS_GH_APP_ID }}
          private-key: ${{ secrets.ZEKO_LABS_GH_APP_PRIVATE_KEY }}
          owner: zeko-labs
          repositories: faucet-cli

      - name: Resolve catalog and workspace dependencies
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');

          const ws = fs.readFileSync('pnpm-workspace.yaml', 'utf8');
          const catalog = {};
          let inCatalog = false;
          for (const line of ws.split('\n')) {
            if (line.trim() === 'catalog:') { inCatalog = true; continue; }
            if (/^\S/.test(line) && inCatalog) { inCatalog = false; }
            if (inCatalog) {
              const m = line.match(/^\s+['\"]?(.+?)['\"]?:\s+(.+?)$/);
              if (m) {
                const name = m[1].replace(/['\"]$/g, '').trim();
                const version = m[2].replace(/^['\"]|['\"]$/g, '').trim();
                catalog[name] = version;
              }
            }
          }

          const dir = 'packages/faucet-cli';
          const packageFiles = [path.join(dir, 'package.json')];
          const npmDir = path.join(dir, 'npm');
          if (fs.existsSync(npmDir)) {
            for (const sub of fs.readdirSync(npmDir)) {
              const pkgFile = path.join(npmDir, sub, 'package.json');
              if (fs.existsSync(pkgFile)) packageFiles.push(pkgFile);
            }
          }

          const localVersions = {};
          for (const file of packageFiles) {
            const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
            localVersions[pkg.name] = pkg.version;
          }

          for (const file of packageFiles) {
            const raw = fs.readFileSync(file, 'utf8');
            const pkg = JSON.parse(raw);
            let changed = false;
            for (const section of ['dependencies', 'devDependencies', 'optionalDependencies', 'peerDependencies']) {
              if (!pkg[section]) continue;
              for (const [name, specifier] of Object.entries(pkg[section])) {
                if (specifier === 'catalog:' && catalog[name]) {
                  pkg[section][name] = catalog[name];
                  changed = true;
                  continue;
                }
                if (specifier.startsWith('workspace:')) {
                  const range = specifier.slice('workspace:'.length);
                  const ver = localVersions[name];
                  if (ver) {
                    pkg[section][name] = range === '^' ? '^' + ver : range === '~' ? '~' + ver : ver;
                    changed = true;
                  }
                }
              }
            }
            if (changed) {
              const indent = raw.startsWith('{\n\t') ? '\t' : 2;
              fs.writeFileSync(file, JSON.stringify(pkg, null, indent) + '\n');
              console.log('Resolved deps in', file);
            }
          }
          "

      - name: Inject packageManager field
        run: |
          PM=$(node -p "require('./package.json').packageManager")
          node -e "
            const fs = require('fs');
            const file = 'packages/faucet-cli/package.json';
            const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
            pkg.packageManager = '$PM';
            const indent = fs.readFileSync(file, 'utf8').startsWith('{\n\t') ? '\t' : 2;
            fs.writeFileSync(file, JSON.stringify(pkg, null, indent) + '\n');
          "

      - name: Generate pnpm-workspace.yaml for standalone repo
        run: printf 'packages:\n  - .\n  - npm/*\n' > packages/faucet-cli/pnpm-workspace.yaml

      - name: Force-push clean commit to standalone repo
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          REMOTE_URL="https://x-access-token:${GH_TOKEN}@github.com/zeko-labs/faucet-cli.git"
          COMMIT_SHA=$(git rev-parse --short HEAD)

          tmp=$(mktemp -d)
          git init "$tmp"
          cp -a packages/faucet-cli/. "$tmp/"
          cd "$tmp"
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync from monorepo (${COMMIT_SHA})"
          git push --force "$REMOTE_URL" HEAD:main

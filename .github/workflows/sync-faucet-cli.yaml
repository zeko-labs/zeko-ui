name: Sync Faucet CLI

on:
  workflow_call:
  workflow_dispatch:

jobs:
  sync:
    uses: ./.github/workflows/sync-package-repo.yaml
    with:
      package-path: packages/faucet-cli
      standalone-repo: faucet-cli
      project-id: faucet-cli
      workspace-packages: |
        packages/faucet-cli
        packages/faucet-cli/npm/*
    secrets: inherit

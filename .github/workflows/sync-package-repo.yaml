name: Sync Package Repo

on:
  workflow_call:
    inputs:
      package-path:
        required: true
        type: string
      standalone-repo:
        required: true
        type: string
      project-id:
        required: true
        type: string
      workspace-packages:
        required: false
        default: "."
        type: string
      extra-workspace-version-sources:
        required: false
        default: ""
        type: string
      branch:
        required: false
        default: "main"
        type: string
  workflow_dispatch:
    inputs:
      package-path:
        required: true
        type: string
      standalone-repo:
        required: true
        type: string
      project-id:
        required: true
        type: string
      workspace-packages:
        required: false
        default: "."
        type: string
      extra-workspace-version-sources:
        required: false
        default: ""
        type: string
      branch:
        required: false
        default: "main"
        type: string

jobs:
  sync:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.ZEKO_LABS_GH_APP_ID }}
          private-key: ${{ secrets.ZEKO_LABS_GH_APP_PRIVATE_KEY }}
          owner: zeko-labs
          repositories: ${{ inputs.standalone-repo }}

      - name: Prepare package for standalone sync
        run: |
          node scripts/sync-standalone-package.mjs \
            --package-dir "${{ inputs.package-path }}" \
            --project-id "${{ inputs.project-id }}" \
            --workspace-packages "${{ inputs.workspace-packages }}" \
            --extra-workspace-version-sources "${{ inputs.extra-workspace-version-sources }}"

      - name: Force-push clean commit to standalone repo
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          REMOTE_URL="https://x-access-token:${GH_TOKEN}@github.com/zeko-labs/${{ inputs.standalone-repo }}.git"
          COMMIT_SHA=$(git rev-parse --short HEAD)

          tmp=$(mktemp -d)
          git init "$tmp"
          cp -a "${{ inputs.package-path }}/." "$tmp/"
          cd "$tmp"
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync from monorepo (${COMMIT_SHA})"
          git push --force "$REMOTE_URL" "HEAD:${{ inputs.branch }}"

name: Actions API Testnet Deploy

on:
  push:
    branches: ["main"]
    paths:
      - "services/actions/api/**"
      - "packages/graphql/**"
      - "packages/cloudflare-build-config/**"
      - ".github/workflows/actions-api-testnet.yaml"

jobs:
  deploy-testnet:
    name: Deploy Testnet
    runs-on: warp-ubuntu-latest-x64-2x
    concurrency:
      group: actions-api-testnet-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy testnet Actions API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: moon exec --ignore-ci-checks actions-api:deploy-testnet

      - name: Validate testnet Actions API
        run: moon exec --ignore-ci-checks actions-api:live-e2e-testnet -f

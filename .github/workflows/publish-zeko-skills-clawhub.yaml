name: Publish Zeko Skills to ClawHub

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semver to publish to ClawHub"
        required: true
        type: string
      changelog:
        description: "Changelog text for this ClawHub release"
        required: true
        type: string
      tags:
        description: "Comma-separated tags to assign"
        required: false
        default: latest
        type: string

jobs:
  publish:
    runs-on: warp-ubuntu-latest-x64-2x
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish zeko skill to ClawHub
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
          ZEKO_SKILLS_CLAWHUB_VERSION: ${{ inputs.version }}
          ZEKO_SKILLS_CLAWHUB_CHANGELOG: ${{ inputs.changelog }}
          ZEKO_SKILLS_CLAWHUB_TAGS: ${{ inputs.tags }}
        run: moon run -f zeko-skills:publish-clawhub
